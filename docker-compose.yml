services:
  bot:
    build: .
    container_name: langchain_faiss_bot
    restart: unless-stopped
    stdin_open: true
    tty: true
    volumes:
      # Пробрасываем папку с векторной базой данных, чтобы она не стиралась при перезапуске
      - ./faiss_index:/app/faiss_index
    environment:
      - YANDEX_API_KEY=${YANDEX_API_KEY}
      - YANDEX_FOLDER_ID=${YANDEX_FOLDER_ID}
